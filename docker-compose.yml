name: task-manager

x-api: &api
  image: task-manager-api:${IMAGE_TAG:-latest}
  build:
    context: ./backend
  environment:
    ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required}
    Jwt__Issuer: ${JWT_ISSUER:-task-manager}
    Jwt__Audience: ${JWT_AUDIENCE:-task-manager-web}
    Jwt__LifetimeMinutes: ${JWT_LIFETIME_MINUTES:-60}
    ASPNETCORE_HTTP_PORTS: 8080
    Logging__Console__FormatterName: json

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrator:
    <<: *api
    command: ["migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    image: task-manager-web:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      PORT: 80
      API_UPSTREAM: http://api:8080
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
