---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
...
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs
  namespace: observability
spec:
  ports:
  - name: http
    port: 9428
    targetPort: http
  selector:
    app: victoria-logs
  type: ClusterIP
...
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victoria-logs
  namespace: observability
spec:
  serviceName: victoria-logs
  replicas: 1
  selector:
    matchLabels:
      app: victoria-logs
  template:
    metadata:
      labels:
        app: victoria-logs
    spec:
      containers:
      - image: victoriametrics/victoria-logs:v1.53.0
        imagePullPolicy: IfNotPresent
        name: victoria-logs
        args:
        - -httpListenAddr=:9428
        - -storageDataPath=/storage
        - -retentionPeriod=7d
        - -retention.maxDiskSpaceUsageBytes=1536MiB
        - -loggerFormat=json
        ports:
        - name: http
          containerPort: 9428
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: storage
          mountPath: /storage
  volumeClaimTemplates:
  - metadata:
      name: storage
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 2Gi
...
